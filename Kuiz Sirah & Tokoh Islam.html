<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kuiz Sirah & Tokoh Islam</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7fb;--card:#fff;--tx:#33284d;--mu:#6b5f85;--rb:linear-gradient(90deg,#ff5e7e,#ff9f43,#ffd93d,#4cd964,#35c7ff,#7c6cff,#d86cff);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1630;--card:#2a2142;--tx:#f5efff;--mu:#c3b7e0}}
:root[data-theme="dark"]{--bg:#1d1630;--card:#2a2142;--tx:#f5efff;--mu:#c3b7e0}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Fredoka,"Segoe UI",system-ui,sans-serif;min-height:100%;padding:12px}
.w{max-width:640px;margin:0 auto;position:relative;z-index:1}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(120deg,#ff5e7e55,#ffd93d55,#4cd96455,#35c7ff55,#d86cff55,#ff5e7e55);background-size:300% 300%;animation:sh 14s ease infinite}
@keyframes sh{50%{background-position:100% 50%}}
#bg i{position:absolute;bottom:-60px;font-style:normal;animation:fl linear infinite}
@keyframes fl{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-60vh) translateX(20px) rotate(180deg)}100%{transform:translateY(-115vh) rotate(360deg)}}
.btn.b2{background:linear-gradient(90deg,#35c7ff,#7c6cff)}.btn.b3{background:linear-gradient(90deg,#ffd93d,#ff9f43)}
.sm{font:inherit;border:0;border-radius:12px;padding:4px 10px;background:#ece8ff;color:#33284d;cursor:pointer}
@media(prefers-reduced-motion:reduce){#bg,#bg i,.ch span{animation:none}}
h1{text-align:center;font-size:2rem;margin:6px 0;background:var(--rb);-webkit-background-clip:text;background-clip:text;color:transparent}
.c{background:var(--card);border-radius:24px;padding:18px;margin:12px 0;border:4px solid transparent;background-image:linear-gradient(var(--card),var(--card)),var(--rb);background-origin:border-box;background-clip:padding-box,border-box}
input{width:100%;font:inherit;padding:12px;border-radius:14px;border:2px solid #b9a8ff;background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-weight:600}
.g{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.p{flex:1 1 90px;font:inherit;font-size:1rem;padding:10px 6px;border-radius:16px;border:3px solid #ddd;background:var(--bg);color:var(--tx);cursor:pointer}
.p.on{border-color:#7c6cff;background:#ece8ff;color:#33284d;transform:scale(1.05)}
.p b{display:block;font-size:2rem}
.btn{display:block;width:100%;font:inherit;font-weight:600;font-size:1.2rem;color:#fff;border:0;border-radius:18px;padding:14px;margin-top:10px;cursor:pointer;background:var(--rb);text-shadow:0 1px 2px #0005}
.o{display:block;width:100%;text-align:left;font:inherit;padding:12px 14px;margin:8px 0;border-radius:16px;border:3px solid #ddd;background:var(--bg);color:var(--tx);cursor:pointer}
.o.ok{border-color:#2ecc71;background:#d5f8e2;color:#16382a}.o.no{border-color:#ff5e7e;background:#ffe0e6;color:#4a1623}
.bar{height:12px;border-radius:9px;background:#0002;overflow:hidden}.bar i{display:block;height:100%;background:var(--rb);transition:.3s}
.top{display:flex;justify-content:space-between;font-weight:600;margin:6px 0}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:8px}.ch span{font-size:3rem;animation:b 1.6s infinite}
.bub{background:#fff4c2;color:#33284d;padding:8px 12px;border-radius:16px;font-weight:600}
@keyframes b{50%{transform:translateY(-6px)}}
.q{font-size:1.2rem;font-weight:600;margin:8px 0}
.cert{text-align:center;background:#fffdf5;color:#33284d;border:10px solid transparent;border-image:var(--rb) 1;padding:20px;border-radius:0}
.cert h2{margin:0;font-size:1.8rem;color:#7c6cff}.cert .n{font-size:2rem;font-weight:600;border-bottom:3px dotted #ff9f43;display:inline-block;padding:0 14px;margin:6px 0;word-break:break-word}
.m{color:var(--mu);font-size:.9rem;text-align:center}
@media print{body{background:#fff}.np{display:none!important}}
</style></head><body><div id="bg"></div><div style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:5;display:flex;gap:6px"><button id="mb" class="sm" onclick="mus()" title="Muzik">🔇</button><a class="sm" style="text-decoration:none" href="https://www.youtube.com/watch?v=0V1jmmgNqSA" target="_blank" rel="noopener">🎧 YouTube</a></div><div class="w"><div id="a"></div></div>
<script>
const T={K:["Khulafa al-Rasyidin","🌟"],U:["Kerajaan Umayyah","🌈"],A:["Kerajaan Abbasiyah","🕌"],M:["Kerajaan Uthmaniah","🏰"],T:["Tokoh Islam","📚"]};
const C=[["🐱","Kiko"],["🐰","Bunny"],["🦄","Unicorn"],["🐼","Panda"],["🐥","Chicky"]];
const D=[
["K","l","Senaraikan dua khalifah Khulafa al-Rasyidin.","Abu Bakar as-Siddiq & Umar al-Khattab (atau Uthman / Ali)"],
["K","n","Siapakah khalifah pertama Khulafa al-Rasyidin?","Saidina Abu Bakar as-Siddiq"],
["K","l","Jelaskan pencapaian Saidina Abu Bakar dari aspek agama.","Berjaya memerangi golongan murtad, nabi palsu & golongan enggan membayar zakat"],
["K","l","Senaraikan dua khalifah Khulafa al-Rasyidin selain Saidina Ali bin Abi Talib.","Abu Bakar al-Siddiq & Umar al-Khattab (atau Uthman bin Affan)"],
["K","n","Khalifah ketiga, dermawan, lemah lembut, digelar Zun Nurain (Pemilik Dua Cahaya). Siapakah tokoh ini?","Saidina Uthman bin Affan"],
["K","n","Nyatakan nama mushaf yang diselaraskan penulisannya oleh beliau (Uthman).","Mushaf Uthmani"],
["K","l","Nyatakan dua ciri kepimpinan Saidina Uthman bin Affan.","Berpandangan jauh (jawatankuasa khas pembukuan al-Quran) & inovatif (angkatan tentera laut Islam)"],
["K","l","Nyatakan dua sifat keprihatinan Saidina Uthman.","Menyumbangkan harta untuk pertahanan negara & membesarkan Masjid Nabawi"],
["K","l","Jelaskan pencapaian Saidina Uthman dalam bidang ketenteraan.","Menubuhkan angkatan tentera laut Islam yang pertama untuk keselamatan & perluasan kuasa"],
["K","l","Jelaskan pencapaian Uthman bin Affan dalam aspek politik dan ketenteraan.","Politik: matahkan pemberontakan, luas wilayah hingga Rusia, Afrika Utara & Cyprus. Tentera: tentera laut Islam pertama"],
["K","l","Nyatakan dua ciri kepimpinan Khalifah Ali bin Abi Talib.","Tegas & berani (juga berilmu, berpandangan jauh)"],
["K","l","Jelaskan dua ciri keberanian Saidina Ali bin Abi Talib.","Sertai hampir semua peperangan di barisan hadapan & sanggup terima jawatan khalifah walau tahu bebanannya"],
["K","l","Jelaskan dua pencapaian Khulafa al-Rasyidin dari aspek ketenteraan.","Teruskan pembebasan Iraq, buka Baitul Maqdis, Palestin & Mesir; tubuh tentera laut Islam pertama"],
["K","l","Jelaskan dua pencapaian Khulafa al-Rasyidin dalam bidang agama.","Abu Bakar perangi murtad, nabi palsu & enggan zakat; Umar sebar dakwah ke Mesir, Parsi & Rom"],
["K","l","Jelaskan dua pencapaian Khulafa al-Rasyidin dalam aspek sosial.","Asas takwim Hijrah; undang-undang pentadbiran tanah; bina tali air untuk pertanian"],
["U","l","Nyatakan sejarah ringkas kerajaan Umayyah.","Pengasas Muawiyah bin Abi Sufian; 41–132H (91 tahun); 14 khalifah; pusat Damsyik, Syria; terakhir Marwan bin Muhammad"],
["U","l","Sejarah Umayyah: pengasas, keluasan, bilangan khalifah & khalifah terakhir.","Muawiyah bin Abi Sufian; Afrika, Asia & Eropah; 14 khalifah; Marwan bin Muhammad"],
["U","n","Nyatakan tempoh pemerintahan kerajaan Umayyah pada tahap pertama.","41H–132H / 661M–750M / 91 tahun"],
["U","l","Senaraikan dua khalifah terkenal Umayyah selain Umar bin Abdul Aziz.","Muawiyah bin Abi Sufian & Abdul Malik bin Marwan (atau al-Walid bin Abdul Malik)"],
["U","l","Jelaskan dua faktor kegemilangan Umayyah dari aspek politik.","Damsyik strategik sebagai pusat; gabenor berwibawa hapus pemberontakan; luas wilayah ke Rom/China/India/Afrika Utara/Eropah"],
["U","l","Jelaskan sumbangan Abdul Malik bin Marwan.","Bahasa Arab bahasa rasmi; cetak dinar Islam pertama; Diwan al-Jund; bina Qubbatus Sokhra"],
["U","l","Jelaskan dua faktor kemerosotan Umayyah dalam aspek sosial.","Taksub kabilah Arab Utara & Selatan; diskriminasi terhadap golongan Mawali (Farsi & Barbar)"],
["U","l","Jelaskan dua faktor kemerosotan Umayyah dari aspek akhlak.","Khalifah hidup mewah & boros; keruntuhan moral kerana hiburan & kekejaman"],
["A","n","Bilangan khalifah 37, meliputi Afrika, Asia & Eropah, pusat Baghdad, Iraq. Nyatakan nama kerajaan ini.","Kerajaan Abbasiyah"],
["A","n","Siapakah khalifah pertama kerajaan Abbasiyah?","Abu al-Abbas Abdullah bin Muhammad al-Saffah"],
["A","l","Jelaskan dua faktor kemerosotan kerajaan Abbasiyah.","Campur tangan pegawai Parsi & Turki; perebutan kuasa khalifah; serangan Monggol (Halagu Khan)"],
["A","l","Nyatakan sejarah ringkas kerajaan Abbasiyah.","Pengasas al-Saffah; 132–656H (524 tahun); 37 khalifah; pusat Baghdad, Iraq; terakhir al-Musta’sim"],
["A","l","Jelaskan dua sumbangan Khalifah Harun al-Rasyid.","Bina Baitul Hikmah; wujudkan Qadi al-Qudho; perkasa cukai Kitab al-Kharaj; Majlis al-Munazarah"],
["M","l","Nyatakan sejarah ringkas kerajaan Uthmaniah.","1299–1924M (625 tahun); pengasas Uthman bin Ertughul; pusat Sogut, Bursa, Edirne, Istanbul; 37 pemerintah; terakhir Sultan Abdul Majid II"],
["M","l","Senaraikan dua khalifah terkenal kerajaan Uthmaniah.","Sultan Uthman bin Ertughul & Sultan Muhammad al-Fateh (atau Murad I / Sulaiman al-Qanuni)"],
["M","l","Nyatakan dua pusat pemerintahan kerajaan Uthmaniah.","Sogut & Bursa (atau Edirne / Istanbul)"],
["M","n","Lahir 656H/1258M, mangkat 726H/1326M, pengasas Kerajaan Uthmaniah. Siapakah pemerintah ini?","Sultan Uthman bin Ertughul"],
["M","n","Apakah jawatan yang disandang oleh Sultan Uthman bin Ertughul?","Pemerintah pertama Kerajaan Uthmaniah"],
["M","l","Jelaskan dua sumbangan Uthman bin Ertughul selain mengasaskan Kerajaan Uthmaniah.","Menyatukan Anatolia Selatan daripada Byzantine & isytihar kemerdekaan Anatolia daripada Saljuk"],
["M","l","Jelaskan dua faktor kegemilangan kerajaan Uthmaniah.","Pemerintah ketua tentera, agama & hakim; kuasai Selat Dardanelles & Bosporus; wakaf sistematik; masjid pusat ilmu"],
["M","l","Jelaskan dua faktor kegemilangan Uthmaniah dari aspek sosial.","Jaga kebajikan rakyat; suasana harmoni; sistem wakaf sistematik (keperluan asas, pendidikan, kesihatan)"],
["M","l","Nyatakan dua sumbangan Murad I bin Urkhan kepada kerajaan Uthmaniah.","Bentuk pasukan Janissary; modenkan tentera laut; jadikan Edirne ibu negara"],
["M","l","Jelaskan faktor kemerosotan kerajaan Uthmaniah.","Ekonomi merosot & hutang tinggi; gerakan menuntut kemerdekaan; perebutan kuasa istana; teknologi tentera ketinggalan"],
["M","l","Nyatakan riwayat hidup Sultan Muhammad al-Fateh.","Muhammad al-Fateh bin Murad II; lahir 833H/1429M; mangkat 886H/1481M; memerintah 31 tahun; pemerintah ketujuh"],
["M","l","Jelaskan dua sumbangan Sultan Muhammad al-Fateh.","Buka Constantinople 857H/1453M; wakafkan Hagia Sofya sebagai masjid; bina kompleks al-Fateh"],
["M","l","Terangkan iktibar daripada pemerintahan kerajaan Uthmaniah.","Pilih pemimpin berwibawa; pegang ajaran Islam; perbanyak penerokaan ilmu; cinta negara; tolak campur tangan asing"],
["T","n","Lahir di Baghdad 164H, terus menuntut ilmu walau bergelar imam, dipenjara kerana pertahankan akidah. Siapakah tokoh ini?","Imam Ahmad bin Hanbal"],
["T","n","Nyatakan hasil karya Imam Ahmad bin Hanbal.","Al-Musnad (juga al-Tarikh, al-‘Illah)"],
["T","l","Nyatakan dua sifat keperibadian Imam Ahmad bin Hanbal.","Terus menuntut ilmu walau masyhur; sangat pemaaf; sanggup dipenjara kerana pertahankan akidah"],
["T","l","Terangkan bukti kesungguhan Imam Ahmad bin Hanbal dalam menuntut ilmu.","Sanggup dipukul & diseksa zaman Khalifah al-Makmun kerana pertahankan pendirian “al-Quran bukan makhluk”"],
["T","l","Jelaskan dua sumbangan Imam Ahmad bin Hanbal dalam tamadun Islam.","Hasilkan karya al-Musnad & asaskan mazhab Hanbali (fatwa sahabat, qiyas, istishab)"],
["T","l","Terangkan iktibar daripada keunggulan Imam mazhab.","Contohi kegigihan menuntut ilmu; hormati perbezaan mazhab; amal & sebarkan ilmu"],
["T","l","Nyatakan riwayat hidup Imam Syafie secara ringkas.","Muhammad bin Idris; lahir 150H di Ghazzah; wafat 204H; kuniyah Abu Abdullah; guru Imam Malik"],
["T","l","Jelaskan dua sumbangan Imam Syafie dalam tamadun Islam.","Hasilkan kitab al-Risalah & al-Umm; asaskan mazhab Syafie (ijma’, qias, istidlal)"],
["T","l","Nyatakan riwayat hidup Salahuddin al-Ayyubi.","Yusuf bin Ayub bin Syazi; 532–589H; pemerintah kerajaan Ayubiyah; hormati ulama & berani pertahankan agama"],
["T","l","Nyatakan nama penuh dan jawatan Salahuddin al-Ayyubi.","Yusuf bin Ayub bin Syazi; Pemerintah kerajaan Ayubiyah"],
["T","l","Jelaskan dua sumbangan Salahuddin al-Ayyubi.","Bebaskan Baitulmaqdis daripada tentera salib; kembalikan akidah Ahli Sunnah wal Jamaah dalam pendidikan"],
["T","l","Jelaskan dua sumbangan Salahuddin al-Ayyubi dalam bidang pentadbiran.","Gedung ubatan diagih ikut gred; ubah dewan istana menjadi hospital"],
["T","l","Terangkan iktibar daripada keunggulan Salahuddin al-Ayyubi.","Contohi kegigihan menuntut ilmu; cekal berdakwah; sebar ilmu; bekerjasama membangunkan negara"],
["T","n","Lahir 14 Oktober 1906, guru Sheikh Muhammad Zahran, murid Yusof al-Qardhawi. Siapakah tokoh ini?","Hassan al-Banna"],
["T","n","Nyatakan sumbangan Hassan al-Banna dalam organisasi.","Mengasaskan pertubuhan Ikhwanul Muslimin"],
["T","l","Senaraikan dua hasil karya Hassan al-Banna.","Muzakirat al-Dakwah wal Da’iyat & Risalah al-Ta’alim (juga al-Ma’thurat)"]
];
const $=document.getElementById("a"),S={ch:0,tp:"X"};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function home(){
$.innerHTML=`<h1>🌈 Kuiz Sirah & Tokoh Islam 🌈</h1><p class="m">Pendidikan Islam SPM · ${D.length} soalan</p><div class="c">
<label>✏️ Nama</label><input id="nm" maxlength="40" placeholder="Nama penuh" value="${E(S.name||"")}">
<label>🏫 Kelas</label><input id="kl" maxlength="20" placeholder="cth: 5 Amanah" value="${E(S.cls||"")}">
<label>🎭 Pilih watak</label><div class="g">${C.map((c,i)=>`<button class="p ${i==S.ch?"on":""}" onclick="S.ch=${i};sv();home()"><b>${c[0]}</b>${c[1]}</button>`).join("")}</div>
<label>🎯 Pilih topik</label><div class="g"><button class="p ${S.tp=="X"?"on":""}" onclick="S.tp='X';sv();home()"><b>🌟</b>Semua (${D.length})</button>${Object.keys(T).map(k=>`<button class="p ${S.tp==k?"on":""}" onclick="S.tp='${k}';sv();home()"><b>${T[k][1]}</b>${T[k][0]} (${D.filter(x=>x[0]==k).length})</button>`).join("")}</div>
<p id="er" style="font-weight:600;text-align:center;margin:0"></p><button class="btn" onclick="go()">🚀 Mula Main!</button>
<button class="btn b2" onclick="go(10)">⚡ Main Pantas (10 soalan)</button>
<button class="btn b3" onclick="help()">📖 Cara Bermain</button></div>`}
function help(){return hp();alert("📖 Cara Bermain\n\n1. Isi nama & kelas, pilih watak dan topik.\n2. Jawab soalan pilihan jawapan.\n3. Jawapan betul = 10 mata, jawapan berturut-turut = mata bonus 🔥\n4. Di akhir, cetak sijil anda! 🎓")}
function sv(){S.name=document.getElementById("nm")?.value??S.name;S.cls=document.getElementById("kl")?.value??S.cls}
function go(n){sv();if(!S.name.trim()||!S.cls.trim()){const e=document.getElementById("er");e.style.color="#e0245e";e.style.whiteSpace="normal";e.textContent="⚠️ Sila isi nama dan kelas dahulu ya 😊";return}
S.qs=sh(D.filter(x=>S.tp=="X"||x[0]==S.tp));if(n)S.qs=S.qs.slice(0,n);S.i=0;S.sc=0;S.ok=0;S.st=0;S.bs=0;ask()}
function ask(){const q=S.qs[S.i],c=C[S.ch];
const pool=sh([...new Set(D.filter(x=>x[1]==q[1]&&x[3]!=q[3]).map(x=>x[3]))]).slice(0,3);
S.op=sh([q[3],...pool]);S.done=0;
$.innerHTML=`<div class="top"><button class="sm" onclick="home()">🏠</button><span>${c[0]} ${E(S.name)}</span><span>⭐ ${S.sc}</span><span>🔥 ${S.st}</span></div>
<div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div><p class="m">Soalan ${S.i+1} / ${S.qs.length} · ${T[q[0]][0]}</p>
<div class="c"><div class="ch"><span>${c[0]}</span><div class="bub" id="bb">Jom jawab! 💪</div></div><div class="q">${E(q[2])}</div>
${S.op.map((o,i)=>`<button class="o" onclick="pk(${i})">${E(o)}</button>`).join("")}<div id="nx"></div></div>`}
function pk(i){if(S.done)return;S.done=1;const q=S.qs[S.i],r=S.op[i]==q[3],b=document.querySelectorAll(".o");
b.forEach((x,j)=>{if(S.op[j]==q[3])x.classList.add("ok")});
if(r){S.ok++;S.st++;S.bs=Math.max(S.bs,S.st);S.sc+=10+Math.min(S.st-1,5)*2}else{b[i].classList.add("no");S.st=0}
const m=r?["Hebat! 🎉","Betul! 🌟","Pandai! 👏","Yeay! 🥳"]:["Tak apa! 💖","Cuba lagi! 🌈","Jangan putus asa! 💪"];
document.getElementById("bb").textContent=m[Math.random()*m.length|0];
document.getElementById("nx").innerHTML=`<button class="btn" onclick="nx()">${S.i+1<S.qs.length?"Seterusnya ➡️":"Lihat Sijil 🎓"}</button>`}
let ac,mt,on=0;
function mus(){const b=document.getElementById("mb");if(on){on=0;clearInterval(mt);b.textContent="🔇";return}
ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();on=1;b.textContent="🎵";
const m=[523,587,659,784,880,784,659,587,523,659,784,659,587,523,392,440];let i=0;
mt=setInterval(()=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type="triangle";o.frequency.value=m[i++%m.length];g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+.4)},300)}
function hp(){const e=document.getElementById("er"),o=e.dataset.h;e.style.whiteSpace="pre-line";e.style.color="var(--tx)";e.textContent=o?"":"📖 Cara Bermain\n1. Isi nama & kelas, pilih watak dan topik.\n2. Jawab soalan pilihan jawapan.\n3. Betul = 10 mata, berturut-turut = bonus 🔥\n4. Di akhir, cetak sijil anda! 🎓";e.dataset.h=o?"":"1"}
function nx(){S.i++;S.i<S.qs.length?ask():fin()}
function fin(){const n=S.qs.length,p=Math.round(S.ok/n*100),g=p>=90?"Cemerlang 🏆":p>=70?"Bagus 🥇":p>=50?"Baik 🥈":"Usaha Lagi 💪";
const tn=S.tp=="X"?"Semua Topik":T[S.tp][0],d=new Date().toLocaleDateString("ms-MY",{day:"numeric",month:"long",year:"numeric"});
$.innerHTML=`<h1 class="np">🎉 Tahniah! 🎉</h1><div class="cert"><div style="font-size:2.6rem">${C[S.ch][0]} 🌈 ${C[S.ch][0]}</div><h2>SIJIL PENCAPAIAN</h2><p>Kuiz Sirah & Tokoh Islam<br>${E(tn)}</p><p>Dengan ini diakui bahawa</p><div class="n">${E(S.name)}</div><p>Kelas <b>${E(S.cls)}</b></p>
<p style="font-size:1.4rem">Skor: <b>${S.sc}</b> mata<br>Betul: <b>${S.ok}/${n}</b> (${p}%)<br>Streak terbaik: 🔥 ${S.bs}</p><p style="font-size:1.5rem;font-weight:600">${g}</p><p class="m" style="color:#6b5f85">${d}</p></div>
<button class="btn np" onclick="window.print()">🖨️ Cetak / Simpan Sijil</button><button class="btn np" onclick="home()">🔄 Main Lagi</button>`}
